description = "Notifications worker for SAGA"
authors = [
    {name = "Ralina", email = "seitovaralina1@gmail.com"}
]
requires-python = "^3.13"
dependencies = [
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "celery (>=5.6.2,<6.0.0)",
